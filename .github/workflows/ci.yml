name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Testcontainers ubuntu runner-də Docker tapır — inteqrasiya testləri real Postgres-lə işləyir
      - name: Test
        run: dotnet test --no-build -c Release

      - name: Admin build
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: CSS build
        working-directory: src/QrCatalog.Web
        run: |
          npm ci
          npm run build:css
